[project]
name = "eval-release-gate"
version = "0.1.0"
description = "A labelled eval set, a pass mark agreed in advance, and a CI check that blocks the release below it."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Venkatesan Ramachandran" }]
dependencies = []

[project.optional-dependencies]
deepeval = ["deepeval"]
ragas = ["ragas"]

[project.scripts]
eval-gate = "eval_gate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_gate"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
